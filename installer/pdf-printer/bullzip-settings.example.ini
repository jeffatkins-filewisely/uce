; Bullzip PDF Printer — per-user %APPDATA%\Bullzip\PDF Printer\settings.ini
; FileWisely install/repair overwrites this with the same keys as global.ini.
; Do not leave "open file after printing" enabled here — it overrides silent capture.

[PDF Printer]
Output=C:\FileWisely\Incoming\<date>_<time>_<docname>.pdf
ShowSaveAS=never
ShowSettings=never
ShowPDF=no
ConfirmOverwrite=no
DisableOptionDialog=yes
OpenFolder=no
OpenPDF=no
