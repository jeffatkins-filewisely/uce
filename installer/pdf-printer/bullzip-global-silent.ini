; Deployed to: C:\ProgramData\PDF Writer\<queue>\global.ini
;              C:\ProgramData\Bullzip\PDF Printer\global.ini
;              %APPDATA%\Bullzip\PDF Printer\settings.ini
; Bullzip PDF Printer 11+ — silent save, no open-after-print.
; See: https://www.bullzip.com/kb/hide-the-print-dialog/

[PDF Printer]
Output=C:\FileWisely\Incoming\<date>_<time>_<docname>.pdf
ShowSaveAS=never
ShowSettings=never
ShowPDF=no
ConfirmOverwrite=no
DisableOptionDialog=yes
OpenFolder=no
OpenPDF=no
