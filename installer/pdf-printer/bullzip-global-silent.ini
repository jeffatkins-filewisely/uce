; Deployed to: C:\ProgramData\PDF Writer\<Bullzip queue name>\global.ini
; Bullzip PDF Printer 11+ / 2026 — system-wide defaults (no Save As dialog).
; See: https://www.bullzip.com/kb/hide-the-print-dialog/

[PDF Printer]
Output=C:\FileWisely\Incoming\<date>_<time>_<docname>.pdf
ShowSaveAS=never
ShowSettings=never
ShowPDF=no
DisableOptionDialog=yes
ConfirmOverwrite=no
