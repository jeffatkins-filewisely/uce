  "uce_open_connection_doctor_cmd",
  "uce_refresh_tray_connection_tooltip",
  "uce_record_heartbeat_outcome",
  "uce_get_connection_diagnostics",
  "uce_test_ingest_connection",
  "uce_copy_diagnostic_report",
  "uce_pipeline_upload_stage",
  "uce_pdf_meta_for_path",
